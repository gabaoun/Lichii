name: Linux AppImage Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload to (default: v1.0-custom)"
        type: string
        default: "v1.0-custom"
  push:
    branches:
      - nx2-custom
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "dist/**"
      - ".github/workflows/linux-build.yml"

permissions:
  contents: write

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2000M
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: |
            ccache-linux-

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Compile Lichii
        shell: bash
        run: |
          if command -v ccache > /dev/null; then ccache --zero-stats; fi
          cmake --build build/release --target yuzu yuzu-cmd --parallel
          if command -v ccache > /dev/null; then ccache --show-stats; fi

      - name: Package Linux tar.gz
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          tar -czf "Lichii-Linux-x86_64.tar.gz" -C build/release/bin lichii eden-cli
          ls -la Lichii-Linux-x86_64.tar.gz

      - name: Package Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/lichii
          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          arch="x86_64"
          curl -fsSL -o "$tools/linuxdeploy-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-$arch.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-$arch.AppImage
          chmod +x "$tools"/*.AppImage

          icon="$RUNNER_TEMP/io.github.zortos293.lichii.png"
          cp dist/lichii.png "$icon"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="v1.0-custom-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="Lichii-Linux-x86_64.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="$arch"

          "$tools/linuxdeploy-$arch.AppImage" --appdir AppDir \
            --executable build/release/bin/lichii \
            --executable build/release/bin/eden-cli \
            --desktop-file dist/io.github.zortos293.lichii.desktop \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage

          test -s "$LDAI_OUTPUT"
          ls -la "$LDAI_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Linux-x86_64
          path: |
            Lichii-Linux-x86_64.AppImage
            Lichii-Linux-x86_64.tar.gz

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.release_tag || 'v1.0-custom' }}"
          echo "Uploading Linux AppImage to release $tag..."
          gh release upload "$tag" Lichii-Linux-x86_64.AppImage Lichii-Linux-x86_64.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber || echo "Failed to upload to release $tag, artifacts are still saved."
